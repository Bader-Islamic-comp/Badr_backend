[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "companion-api"
version = "0.1.0"
description = "Adult-operated synthetic development foundation"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115.12,<1", "httpx>=0.28,<1", "pydantic>=2.11,<3", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
