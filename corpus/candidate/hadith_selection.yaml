# Nawawi 40 entries are eligible only through their linked Bukhari/Muslim record (cluster).
# Bukhari/Muslim entries carry a `lookup_phrase`: a few words used ONLY to find the record in
# corpus/canonical; it is not hadith text and is never stored as such. The checker
# (python3 scripts/build_corpus.py --write-selection) writes `number`, `ref`, `cluster_id` and
# `needs_check` from the canonical data: needs_check is false only when the record is found,
# eligible (match or contained_in_secondary, non-empty text) and the phrase occurs in it.
# `topic` and `why_for_kids` are short notes for reviewers, not text for children.
# Excluded from Nawawi 40 on suitability grounds for ages 7-11: 8 (fighting), 14 (capital
# punishment), 25 (marital content), 38 (war declared); 4 (stages of creation) left for review later.
