# Gold retrieval questions, source form (corpus tasks Phase 5, task 12).
# SYNTHETIC: every question was written for evaluation by the model (2026-09-27); none comes from a
# child. approval_status: pending for every item until a reviewer approves the question, its expected
# references and its notes. `refs` are Quran references inside the Wave 1 source maps, or `selection:N`
# (the Nth entry of corpus/candidate/hadith_selection.yaml). scripts/build_eval.py resolves them to
# chunk ids of corpus/wave1 and refuses any reference the corpus does not contain.
# Variants: msa, gulf, levantine, egyptian, misspelled, arabizi, english_transliteration.
schema_version: 1
intents:
# --- Adam -------------------------------------------------------------------------------------------
- id: adam-01
  refs: [quran:2:30-34, quran:7:11, quran:15:28-31, quran:38:71-73, quran:17:61, quran:18:50, quran:20:116]
  notes: Allah tells the angels He will place a khalifa; the angels prostrate to Adam.
  q:
    msa: ماذا طلب الله من الملائكة عندما خلق آدم؟
    gulf: وش قال الله للملايكة لما خلق آدم؟
    misspelled: ماذا طلب اللة من الملاءكه لما خلق ادم
    arabizi: shu talab allah mn el malaeke lama 5ala2 adam?
    english_transliteration: What did Allah ask the angels to do when He created Adam?
- id: adam-02
  refs: [quran:2:31-33]
  notes: Allah taught Adam the names; the angels could not tell them.
  q:
    msa: ما الذي علّمه الله لآدم عليه السلام؟
    levantine: شو علّم الله لآدم؟
    misspelled: ماالذي علمة الله لادم عليه السلام
    arabizi: shu 3allam allah la adam?
    english_transliteration: What did Allah teach Prophet Adam?
- id: adam-03
  refs: [quran:2:34, quran:7:11-12, quran:15:31-33, quran:17:61, quran:38:73-76, quran:18:50, quran:20:116]
  notes: Iblis refused to prostrate out of arrogance, claiming he was better.
  q:
    msa: لماذا رفض إبليس أن يسجد لآدم؟
    egyptian: ليه إبليس مرضيش يسجد لآدم؟
    misspelled: ليش ابليس رفض يسجد لادم
    arabizi: leish iblees rafad yosjod la adam?
    english_transliteration: Why did Iblis refuse to bow to Adam?
- id: adam-04
  refs: [quran:2:35-36, quran:7:19-22, quran:20:117-121]
  notes: Adam and his wife in the garden, told not to approach the tree; Shaytan tempted them.
  q:
    msa: ما قصة الشجرة التي نهى الله آدم عنها؟
    gulf: وش سالفة الشجرة اللي الله نهى آدم عنها؟
    misspelled: ما قصه الشجره الي نهى الله ادم عنها
    arabizi: shu 2esset el shajara elli allah naha adam 3anha?
    english_transliteration: What is the story of the tree Adam was told not to eat from?
- id: adam-05
  refs: [quran:2:37, quran:7:23, quran:20:122]
  notes: Adam received words from his Lord and repented; Allah accepted his repentance.
  q:
    msa: كيف تاب آدم عليه السلام بعد أن أكل من الشجرة؟
    levantine: كيف آدم تاب بعد ما أكل من الشجرة؟
    misspelled: كيف تاب ادم بعد مااكل من الشجره
    arabizi: kif adam tab ba3d ma akal mn el shajara?
    english_transliteration: How did Adam repent after eating from the tree?
- id: adam-06
  refs: [quran:2:36-38, quran:7:24-25, quran:20:123]
  notes: Adam and his wife were sent down to the earth.
  q:
    msa: أين عاش آدم بعد أن خرج من الجنة؟
    egyptian: آدم راح فين بعد ما خرج من الجنة؟
    misspelled: وين عاش ادم بعد ماخرج من الجنه
    arabizi: wein 3ash adam ba3d ma tele3 mn el jannah?
    english_transliteration: Where did Adam live after leaving Jannah?
- id: adam-07
  refs: [quran:18:50]
  notes: Iblis was of the jinn.
  q:
    msa: هل كان إبليس من الملائكة أم من الجن؟
    gulf: إبليس كان من الملايكة ولا من الجن؟
    misspelled: هل كان ابليس من الملاءكة ام من الجن
    arabizi: iblees kan mn el malaeke walla mn el jinn?
    english_transliteration: Was Iblis one of the angels or one of the jinn?
# --- Nuh --------------------------------------------------------------------------------------------
- id: nuh-01
  refs: [quran:29:14]
  notes: Nuh stayed among his people a thousand years less fifty.
  q:
    msa: كم سنة دعا نوح عليه السلام قومه؟
    levantine: قديش ضل نوح يدعي قومه؟
    misspelled: كم سنه دعى نوح قومة
    arabizi: 2adeish dal noo7 yed3i 2awmo?
    english_transliteration: How many years did Prophet Nuh call his people?
- id: nuh-02
  refs: [quran:11:37-38, quran:23:27]
  notes: Allah told Nuh to build the ark under His eyes and inspiration.
  q:
    msa: من أمر نوحاً ببناء السفينة؟
    egyptian: مين قال لنوح يبني السفينة؟
    misspelled: مين امر نوح يبني السفينه
    arabizi: meen amar noo7 yebni el safine?
    english_transliteration: Who told Nuh to build the ark?
- id: nuh-03
  refs: [quran:11:42-43, quran:11:45-46]
  notes: Nuh's son refused to board, said he would take refuge on a mountain, and drowned.
  q:
    msa: ماذا حدث لابن نوح عندما رفض أن يركب السفينة؟
    gulf: وش صار لولد نوح لما رفض يركب السفينة؟
    misspelled: شو صار لابن نوح لما رفض يركب السفينه
    arabizi: shu sar la ibn noo7 lama rafad yerkab el safine?
    english_transliteration: What happened to Nuh's son when he refused to get on the ark?
- id: nuh-04
  refs: [quran:11:38, quran:54:9, quran:26:105-111, quran:23:24-25]
  notes: His people mocked him while he built the ark and rejected him.
  q:
    msa: كيف كان قوم نوح يعاملونه وهو يبني السفينة؟
    levantine: شو كانوا يعملوا قوم نوح وهو عم يبني السفينة؟
    misspelled: كيف كان قوم نوح يعاملونة وهو يبني السفينه
    arabizi: shu kano ya3mlo 2awm noo7 w howe 3am yebni el safine?
    english_transliteration: How did Nuh's people treat him while he was building the ark?
- id: nuh-05
  refs: [quran:54:11-12, quran:11:40, quran:11:44, quran:23:27]
  notes: Water poured from the sky and gushed from the earth; then the water subsided.
  q:
    msa: من أين جاء ماء الطوفان في قصة نوح؟
    egyptian: مية الطوفان جت منين في قصة نوح؟
    misspelled: من وين اجا ماء الطوفان بقصه نوح
    arabizi: mn wein ija mai el tofan b 2esset noo7?
    english_transliteration: Where did the water of the flood come from in Nuh's story?
- id: nuh-06
  refs: [quran:71:5-9]
  notes: Nuh called his people night and day, openly and in private.
  q:
    msa: متى كان نوح عليه السلام يدعو قومه؟
    gulf: نوح متى كان يدعي قومه؟ بالليل ولا بالنهار؟
    misspelled: متا كان نوح يدعو قومة
    arabizi: noo7 emta kan yed3i 2awmo, bel leil walla bel nhar?
    english_transliteration: Did Prophet Nuh call his people at night or in the day?
# --- Ibrahim ----------------------------------------------------------------------------------------
- id: ibrahim-01
  refs: [quran:21:57-63, quran:37:91-93]
  notes: Ibrahim broke the idols except the biggest one.
  q:
    msa: ماذا فعل إبراهيم عليه السلام بالأصنام؟
    levantine: شو عمل إبراهيم بالأصنام؟
    misspelled: ماذا فعل ابراهيم بالاصنام
    arabizi: shu 3emel ibrahim bel asnam?
    english_transliteration: What did Prophet Ibrahim do to the idols?
- id: ibrahim-02
  refs: [quran:21:68-70, quran:29:24, quran:37:97-98]
  notes: They threw Ibrahim into the fire; Allah made it cool and safe.
  q:
    msa: ماذا حدث للنار عندما ألقي فيها إبراهيم؟
    egyptian: النار عملت إيه لما رموا إبراهيم فيها؟
    misspelled: ماذا حدث للنار لما القوا ابراهيم فيها
    arabizi: shu sar lal nar lama kabbo ibrahim fiha?
    english_transliteration: What happened to the fire when Ibrahim was thrown into it?
- id: ibrahim-03
  refs: [quran:6:76-79]
  notes: Ibrahim looked at a star, the moon and the sun, each setting, and turned to the One who created the heavens.
  q:
    msa: ما قصة إبراهيم مع النجم والقمر والشمس؟
    gulf: وش قصة إبراهيم مع النجمة والقمر والشمس؟
    misspelled: ماقصه ابراهيم مع النجم والقمر والشمس
    arabizi: shu 2esset ibrahim ma3 el najme wel 2amar wel shams?
    english_transliteration: What is the story of Ibrahim with the star, the moon and the sun?
- id: ibrahim-04
  refs: [quran:19:42-48, quran:6:74, quran:21:52, quran:26:70-72]
  notes: Ibrahim spoke gently to his father about worshipping what cannot hear or see.
  q:
    msa: كيف كلّم إبراهيم أباه عن عبادة الأصنام؟
    levantine: كيف حكى إبراهيم مع أبوه عن الأصنام؟
    misspelled: كيف كلم ابراهيم اباة عن عباده الاصنام
    arabizi: kif 7aka ibrahim ma3 abuh 3an el asnam?
    english_transliteration: How did Ibrahim talk to his father about the idols?
- id: ibrahim-05
  refs: [quran:2:127-129]
  notes: Ibrahim and Ismail raised the foundations of the House and made du'a.
  q:
    msa: من بنى الكعبة مع إبراهيم عليه السلام؟
    egyptian: مين بنى الكعبة مع سيدنا إبراهيم؟
    misspelled: مين بنا الكعبه مع ابراهيم
    arabizi: meen bana el ka3ba ma3 ibrahim?
    english_transliteration: Who built the Kaaba with Prophet Ibrahim?
- id: ibrahim-06
  refs: [quran:11:69-73, quran:51:24-30, quran:15:51-56]
  notes: Honoured guests (angels) came; Ibrahim served a calf; they brought glad tidings of a son.
  q:
    msa: ما قصة ضيوف إبراهيم الذين بشروه بولد؟
    gulf: وش قصة الضيوف اللي جوا إبراهيم وبشروه بولد؟
    misspelled: ماقصه ضيوف ابراهيم الي بشروة بولد
    arabizi: shu 2esset el dyof elli ijo 3ala ibrahim w basharo bi walad?
    english_transliteration: What is the story of the guests who gave Ibrahim good news of a son?
- id: ibrahim-07
  refs: [quran:37:102-107]
  notes: Ibrahim saw in a dream that he was sacrificing his son; both submitted; it was ransomed.
  q:
    msa: ما الرؤيا التي رآها إبراهيم عن ابنه؟
    levantine: شو المنام اللي شافه إبراهيم عن ابنه؟
    misspelled: ماالرؤيه الي راها ابراهيم عن ابنة
    arabizi: shu el manam elli shafo ibrahim 3an ibno?
    english_transliteration: What dream did Ibrahim see about his son?
- id: ibrahim-08
  refs: [quran:2:260]
  notes: Ibrahim asked to see how Allah gives life to the dead; the four birds.
  q:
    msa: ما قصة الطيور الأربعة مع إبراهيم عليه السلام؟
    egyptian: إيه حكاية الأربع طيور مع إبراهيم؟
    misspelled: ماقصه الطيور الاربعه مع ابراهيم
    arabizi: shu 2esset el arba3 tyoor ma3 ibrahim?
    english_transliteration: What is the story of Ibrahim and the four birds?
# --- Yusuf ------------------------------------------------------------------------------------------
- id: yusuf-01
  refs: [quran:12:4-5]
  notes: Yusuf saw eleven stars, the sun and the moon prostrating to him and told his father.
  q:
    msa: ماذا رأى يوسف عليه السلام في منامه وهو صغير؟
    gulf: وش شاف يوسف في منامه وهو صغير؟
    misspelled: ماذا راى يوسف فى منامة وهو صغير
    arabizi: shu shaf yusuf b manamo w howe zghir?
    english_transliteration: What did Prophet Yusuf see in his dream when he was young?
- id: yusuf-02
  refs: [quran:12:8-9]
  notes: The brothers said their father loved Yusuf and his brother more.
  q:
    msa: لماذا غار إخوة يوسف منه؟
    levantine: ليش إخوة يوسف غاروا منه؟
    misspelled: ليش اخوه يوسف غارو منه
    arabizi: leish ekhwet yusuf gharo meno?
    english_transliteration: Why were Yusuf's brothers jealous of him?
- id: yusuf-03
  refs: [quran:12:10, quran:12:15]
  notes: They agreed to put him at the bottom of the well.
  q:
    msa: أين ألقى الإخوة يوسف عليه السلام؟
    egyptian: إخوات يوسف رموه فين؟
    misspelled: وين رمو اخوه يوسف يوسف
    arabizi: wein rmo ekhwet yusuf yusuf? bel bir?
    english_transliteration: Where did the brothers throw Yusuf?
- id: yusuf-04
  refs: [quran:12:16-18]
  notes: They came weeping at night with false blood on his shirt and said a wolf ate him.
  q:
    msa: ماذا قال الإخوة لأبيهم عندما عادوا بدون يوسف؟
    gulf: وش قالوا الإخوان لأبوهم لما رجعوا بدون يوسف؟
    misspelled: شو قالو الاخوه لابوهم لما رجعو بدون يوسف
    arabizi: shu 2alo el ekhwe la abuhom lama rij3o bdoon yusuf?
    english_transliteration: What did the brothers tell their father when they came back without Yusuf?
- id: yusuf-05
  refs: [quran:12:36-41]
  notes: Two young men in prison told Yusuf their dreams; he called them to tawhid, then interpreted.
  q:
    msa: من الذين دخلوا السجن مع يوسف وماذا رأوا في المنام؟
    levantine: مين اللي فاتوا عالسجن مع يوسف وشو شافوا بالمنام؟
    misspelled: مين الي دخلو السجن مع يوسف وشو شافو بالمنام
    arabizi: meen elli fato 3al sijn ma3 yusuf w shu shafo bel manam?
    english_transliteration: Who went to prison with Yusuf and what did they dream about?
- id: yusuf-06
  refs: [quran:12:43-49]
  notes: The king's dream of seven fat cows and seven lean, and ears of corn; Yusuf interpreted it.
  q:
    msa: ما رؤيا الملك التي فسرها يوسف عليه السلام؟
    egyptian: الملك شاف إيه في الحلم ويوسف فسره إزاي؟
    misspelled: ما روءيا الملك الي فسرها يوسف
    arabizi: shu shaf el malik bel 7elem w kif fassaro yusuf?
    english_transliteration: What was the king's dream that Yusuf explained?
- id: yusuf-07
  refs: [quran:12:58-62, quran:12:69]
  notes: The brothers came to Egypt for provisions; he recognized them and they did not recognize him.
  q:
    msa: هل عرف الإخوة يوسف عندما جاؤوا إليه لأخذ الطعام؟
    gulf: الإخوان عرفوا يوسف لما جوه ياخذون أكل؟
    misspelled: هل عرف الاخوه يوسف لما جاو ياخدو الاكل
    arabizi: el ekhwe 3erfo yusuf lama ijo yakhdo akl?
    english_transliteration: Did the brothers recognize Yusuf when they came to get food?
- id: yusuf-08
  refs: [quran:12:89-92]
  notes: Yusuf revealed himself and forgave them, "no blame on you today".
  q:
    msa: ماذا قال يوسف لإخوته بعد أن عرّفهم بنفسه؟
    levantine: شو قال يوسف لإخوته لما عرّفهم عحاله؟
    misspelled: شو قال يوسف لاخوتة بعد ماعرفهم بحالو
    arabizi: shu 2al yusuf la ekhwto lama 3arrafhom 3a 7alo?
    english_transliteration: What did Yusuf say to his brothers after he told them who he was?
- id: yusuf-09
  refs: [quran:12:93-96]
  notes: Yusuf's shirt was cast over Ya'qub's face and his sight returned.
  q:
    msa: كيف عاد البصر إلى يعقوب عليه السلام؟
    egyptian: سيدنا يعقوب رجعله نظره إزاي؟
    misspelled: كيف رجع البصر ليعقوب
    arabizi: kif reje3 el nazar la ya3qoob?
    english_transliteration: How did Prophet Yaqub get his eyesight back?
- id: yusuf-10
  refs: [quran:12:18, quran:12:83-87]
  notes: Ya'qub said "sabrun jamil" and did not despair of Allah's mercy.
  q:
    msa: كيف صبر يعقوب عليه السلام على فراق يوسف؟
    gulf: كيف صبر يعقوب على فراق ولده يوسف؟
    misspelled: كيف صبر يعقوب على فراق يوسف ومااياس
    arabizi: kif sabar ya3qoob 3ala fra2 yusuf?
    english_transliteration: How was Yaqub patient when he lost Yusuf?
# --- Musa -------------------------------------------------------------------------------------------
- id: musa-01
  refs: [quran:28:7, quran:20:38-39]
  notes: Allah inspired Musa's mother to put him in the river.
  q:
    msa: لماذا وضعت أم موسى ابنها في النهر؟
    levantine: ليش إم موسى حطّت ابنها بالنهر؟
    misspelled: ليش ام موسا حطت ابنها بالنهر
    arabizi: leish emm mousa 7attat ibna bel nahr?
    english_transliteration: Why did Musa's mother put her baby in the river?
- id: musa-02
  refs: [quran:28:8-13, quran:20:40]
  notes: Pharaoh's family picked him up; he refused other nurses and was returned to his mother.
  q:
    msa: كيف رجع موسى الرضيع إلى أمه؟
    egyptian: موسى وهو صغير رجع لأمه إزاي؟
    misspelled: كيف رجع موسا الرضيع لامة
    arabizi: kif reje3 mousa el zghir la emmo?
    english_transliteration: How did baby Musa return to his mother?
- id: musa-03
  refs: [quran:20:9-14, quran:28:29-30, quran:27:7-9]
  notes: Musa saw a fire, went to it, and was called; Allah spoke to him.
  q:
    msa: ماذا رأى موسى عليه السلام في الطريق فذهب إليه وكلمه الله؟
    gulf: وش شاف موسى بالطريق وراح له وكلمه الله؟
    misspelled: شو شاف موسا بالطريق وراحلة وكلمة الله
    arabizi: shu shaf mousa bel tari2 w ra7 3ando w kallamo allah?
    english_transliteration: What did Musa see on the road before Allah spoke to him?
- id: musa-04
  refs: [quran:20:17-21, quran:28:31, quran:27:10, quran:7:107, quran:26:32]
  notes: Musa's staff became a moving snake as a sign.
  q:
    msa: ماذا حدث لعصا موسى عندما ألقاها؟
    levantine: شو صار بعصاية موسى لما رماها؟
    misspelled: ماذا حدث لعصى موسا لما القاها
    arabizi: shu sar b 3asayet mousa lama rama7a?
    english_transliteration: What happened to Musa's staff when he threw it down?
- id: musa-05
  refs: [quran:20:29-36, quran:28:34-35]
  notes: Musa asked that his brother Harun be his helper.
  q:
    msa: من الذي طلب موسى أن يكون معه في الدعوة؟
    egyptian: موسى طلب مين يكون معاه وهو رايح لفرعون؟
    misspelled: مين الي طلب موسا يكون معو بالدعوه
    arabizi: meen talab mousa ykoon ma3o w howe ray7 3a fer3on?
    english_transliteration: Who did Musa ask to go with him to Firawn?
- id: musa-06
  refs: [quran:20:65-70, quran:7:113-122, quran:26:41-48]
  notes: The magicians threw ropes; Musa's staff swallowed them; the magicians believed.
  q:
    msa: ماذا حدث في المواجهة بين موسى والسحرة؟
    gulf: وش صار بين موسى والسحرة؟
    misspelled: شو صار بين موسا والسحره
    arabizi: shu sar bein mousa wel sa7ara?
    english_transliteration: What happened when Musa faced the magicians?
- id: musa-07
  refs: [quran:26:61-66, quran:20:77-78, quran:2:50]
  notes: Musa struck the sea with his staff and it parted; the believers were saved.
  q:
    msa: كيف نجا موسى وقومه من فرعون عند البحر؟
    levantine: كيف نجي موسى وجماعته من فرعون عند البحر؟
    misspelled: كيف نجا موسا وقومة من فرعون عند البحر
    arabizi: kif naja mousa w 2awmo mn fer3on 3end el ba7r?
    english_transliteration: How were Musa and his people saved from Firawn at the sea?
- id: musa-08
  refs: [quran:20:85-97, quran:7:148-150]
  notes: While Musa was away, the Samiri made a calf and people worshipped it.
  q:
