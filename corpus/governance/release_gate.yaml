# The release gate (doc/governance/release-gate.md), checked by `python scripts/check_release_gate.py`.
#
# Every item of a switch must be green before /v1/bootstrap may offer that switch to a child:
#   generativeAnswers  model-written answers and chat outside the adult operators' development mode
#   voice              push-to-talk
# kind H = human: every decision item matching `decisions` has an applied, audited final decision
#          (corpus/governance/decision_state.json and audit.jsonl, as scripts/progress_score.py counts it).
#          A `policy-<name>` item exists once doc/governance/<name>.md is written.
# kind M = automated: every `evidence` path exists and every command exits 0; `check` names a check built into
#          the script.
schema_version: 1
switches: [generativeAnswers, voice]
