# Alias gazetteer: the 25 prophets named in the Quran, their Quranic names and titles, Latin
# transliterations and Arabizi spellings (doc/plan.md component 2). Deterministic lookup data for
# query rewriting and filtering; it is never shown to a child.
#
# Evidence: every Arabic name or title points at an ayah. `evidence: auto` means the checker finds the
# ayat containing the name itself; otherwise `ref` + `phrase` must occur in that ayah (simple text,
# norm-v2). `status` is written by `python3 scripts/build_corpus.py --write-aliases`: evidence_found
# when the check passes, needs_check otherwise. Latin and Arabizi spellings are variants of the
# checked Arabic name, proposed without a source, so they are all needs_check until a person confirms.
# origin: model_proposed (2026-09-27). review_status: draft.
schema_version: 1
