# Cross-lingual glossary (test/corpus-tasks): Arabic terms of the wave-1 stories and hadith topics, with the
# English and Arabizi words a child may use for them, and the reference package's sample terms. Used only to
# rewrite an Arabizi question into Arabic search terms (rag/arabizi.py, through
# src/companion_api/rag/data/query_aliases.json); never shown to a child. Prophets' names come from
# corpus/aliases.yaml, not from here.
# review_status: draft. Every entry needs_check by an Arabic-language reviewer: add variants children really
# type, remove any that mislead. Regenerate the JSON afterwards with
#   python scripts/export_query_aliases.py
#
# Fields (schema 2; checked by scripts/export_query_aliases.py):
#   ar          the Arabic term
#   latin       English and Arabizi words a child may type: model_proposed (2026-10-01; page-7 terms 2026-10-02)
#   origin      glossary (wave-1 terms, model_proposed 2026-10-01; the default) or package_page_7: the sample
#               glossary on page 7 of the reference package «المرجعية والحزمة العلمية والبيانات» (20/3/1448)
#   sensitive   true for an Islamic term whose English the package wants from an approved dictionary rather than
#               machine translation (the rest are everyday words of the stories): model_proposed. Page-7 terms
#               are sensitive by definition. scripts/crawl_jamharah.py reads these entries first.
#   query       the form looked up in the Jamharah dictionary when the term is inflected: model_proposed
#   jamharah    the dictionary entry (islamic-content.com/dictionary) matched by scripts/crawl_jamharah.py on
#               2026-10-02: {id, url, en}. `en` is the entry's English heading, `en: null` when the entry has no
#               English translation, and absent when its English page was not read (the crawl's request budget
#               ran out; the sensitive terms were read first). `unmatched`: no entry has exactly this title
#               (never guessed). A match is by title only: `sense: differs` marks an entry whose heading or
#               definition gives another meaning than the story's word, `sense: unclear` one a reviewer should
#               check (both model_proposed). Definitions stay in the snapshot outside git
#               (corpus/raw/jamharah-dictionary-entries/).
#   en, usage_rule  page-7 terms: the package's English equivalent and a short paraphrase of its usage rule
#   provenance  page-7 terms: where each field comes from: package_page_7, jamharah or model_proposed
#               (unverified). Where Jamharah's English differs from the package's, the package's is used.
schema_version: 2
