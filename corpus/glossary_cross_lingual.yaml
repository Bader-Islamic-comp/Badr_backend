# Reference package, page 7: the sample glossary (term, English equivalent, usage rule)
- ar: الإسلام
  origin: package_page_7
  en: Islam
  usage_rule: Submission to Allah through tawhid and obedience; explained from its context, never reduced to a general cultural meaning.
  latin: [islam, islaam, eslam]
  jamharah: {id: 1018, url: 'https://islamic-content.com/dictionary/word/1018', en: Islam}
  provenance: {en: package_page_7, usage_rule: package_page_7, latin: model_proposed, jamharah: jamharah}
- ar: التوحيد
  origin: package_page_7
  en: Tawhid / Oneness of God
  usage_rule: Keep the term and explain it as singling Allah out in lordship, worship and the names and attributes revelation gives Him; never a translation that suggests mere numerical oneness.
  latin: [tawhid, tawheed, tauhid, oneness of god]
  jamharah: {id: 3529, url: 'https://islamic-content.com/dictionary/word/3529', en: Monotheism}
  provenance: {en: package_page_7, usage_rule: package_page_7, latin: model_proposed, jamharah: jamharah}
- ar: العبادة
  origin: package_page_7
  en: Worship
  usage_rule: Every act of the heart, tongue and limbs by which a servant draws near to Allah; not limited to rituals.
  latin: [worship, ibada, ibadah, 3ibada, 3ibadah, 3ebade]
  jamharah: {id: 6732, url: 'https://islamic-content.com/dictionary/word/6732', en: Worship}
  provenance: {en: package_page_7, usage_rule: package_page_7, latin: model_proposed, jamharah: jamharah}
- ar: النبوة
  origin: package_page_7
  en: Prophethood
  usage_rule: Allah's choosing of prophets through revelation; kept distinct from human religious leadership.
  latin: [prophethood, nubuwwa, nubuwwah, nubuwah, nobowa, nboweh]
  jamharah: {id: 10342, url: 'https://islamic-content.com/dictionary/word/10342', en: Prophethood}
  provenance: {en: package_page_7, usage_rule: package_page_7, latin: model_proposed, jamharah: jamharah}
- ar: الوحي
  origin: package_page_7
  en: Revelation
  usage_rule: What Allah revealed to His prophets; avoid loose uses that suggest personal inspiration.
  latin: [revelation, wahy, wahi, wa7y, wa7i]
  jamharah: {id: 10849, url: 'https://islamic-content.com/dictionary/word/10849', en: Revelation}
  provenance: {en: package_page_7, usage_rule: package_page_7, latin: model_proposed, jamharah: jamharah}
- ar: الشريعة
  origin: package_page_7
  en: Sharia / Islamic law and guidance
  usage_rule: Explained from its context; never reduced to punishments or criminal law.
  latin: [sharia, shariah, sharee3a, shari3a]
  jamharah: {id: 5979, url: 'https://islamic-content.com/dictionary/word/5979', en: The sharia}
  provenance: {en: package_page_7, usage_rule: package_page_7, latin: model_proposed, jamharah: jamharah}
- ar: الحديث
  origin: package_page_7
  en: Hadith
  usage_rule: What is transmitted from the Prophet (peace be upon him) of word, deed or approval; its grading is stated whenever it is used as evidence.
  latin: [hadith, hadeeth, 7adith, 7adeeth, hadis]
  jamharah: {id: 4139, url: 'https://islamic-content.com/dictionary/word/4139', en: Hadith}
  provenance: {en: package_page_7, usage_rule: package_page_7, latin: model_proposed, jamharah: jamharah}
- ar: السنة
  origin: package_page_7
  en: Sunnah
  usage_rule: The Prophet's (peace be upon him) guidance and way; its exact meaning follows the scholarly context.
  latin: [sunnah, sunna, sunneh]
  jamharah: {id: 5744, url: 'https://islamic-content.com/dictionary/word/5744', en: The sunnah}
  provenance: {en: package_page_7, usage_rule: package_page_7, latin: model_proposed, jamharah: jamharah}
- ar: الفتوى
  origin: package_page_7
  en: Fatwa
  usage_rule: A shar'i answer by a qualified person to a case or question; never equated with general information.
  latin: [fatwa, fatwah, fatawa]
  jamharah: {id: 7399, url: 'https://islamic-content.com/dictionary/word/7399', en: Fatwa}
  provenance: {en: package_page_7, usage_rule: package_page_7, latin: model_proposed, jamharah: jamharah}
- ar: الدعوة
  origin: package_page_7
  en: Da'wah / Invitation to Islam
  usage_rule: Introducing and inviting to Islam with wisdom; the English equivalent is chosen by context and audience.
  latin: [dawah, da3wa, da3wah, da3weh]
  jamharah: {id: 4890, url: 'https://islamic-content.com/dictionary/word/4890', en: Invitation}
  provenance: {en: package_page_7, usage_rule: package_page_7, latin: model_proposed, jamharah: jamharah}
