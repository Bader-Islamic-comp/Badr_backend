# Cross-lingual glossary (test/corpus-tasks): Arabic terms of the wave-1 stories and hadith topics, with the
# English and Arabizi words a child may use for them. Used only to rewrite an Arabizi question into Arabic search
# terms (rag/arabizi.py, through src/companion_api/rag/data/query_aliases.json); never shown to a child.
# Prophets' names come from corpus/aliases.yaml, not from here.
# origin: model_proposed (2026-10-01). review_status: draft. Every entry needs_check by an Arabic-language
# reviewer: add variants children really type, remove any that mislead. Regenerate the JSON afterwards with
#   python scripts/export_query_aliases.py
